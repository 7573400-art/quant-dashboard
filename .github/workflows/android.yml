name: Android APK

on:
  push:
    paths:
      - "insta_downloader/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insta_downloader/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 저장소 Secrets 에 서명 키가 있으면 사용한다 (없으면 디버그 키로 서명)
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "out/InstaSaver-1.0.${GITHUB_RUN_NUMBER}-${abi}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: InstaSaver-apk
          path: insta_downloader/android/out/*.apk

      # 휴대폰에서 바로 받을 수 있도록 Releases 에도 올린다
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: 인스타저장 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            대부분의 휴대폰은 **arm64-v8a** 파일을 받으면 됩니다.
            (오래된 32비트 폰은 armeabi-v7a, 에뮬레이터는 x86_64)
          files: insta_downloader/android/out/*.apk
