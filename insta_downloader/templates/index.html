<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>인스타 다운로더</title>
  <meta name="theme-color" content="#d62976">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #fafafa; --card: #fff; --text: #111; --muted: #777; --line: #e5e5e5;
      --accent: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      --error: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e0e; --card: #1b1b1b; --text: #f2f2f2; --muted: #999; --line: #2c2c2c; --error: #ff6b6b; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .box { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; padding: 14px; font-size: 16px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
    }
    button {
      border: 0; border-radius: 12px; padding: 14px 16px; font-size: 16px; font-weight: 600;
      cursor: pointer; color: #fff; background: var(--accent);
    }
    button.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); }
    button:disabled { opacity: .5; cursor: default; }
    .go { width: 100%; margin-top: 10px; }
    .msg { margin-top: 16px; font-size: 14px; color: var(--muted); }
    .msg.error { color: var(--error); }
    .meta { margin-top: 20px; font-size: 14px; }
    .meta b { display: block; margin-bottom: 4px; }
    .meta p { color: var(--muted); margin: 0; white-space: pre-line; }
    .item {
      margin-top: 14px; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; overflow: hidden;
    }
    .item img { width: 100%; display: block; max-height: 520px; object-fit: cover; background: #000; }
    .item .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px; }
    .item .info { font-size: 13px; color: var(--muted); }
    .spin {
      display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor;
      border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px;
    }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<main>
  <h1>인스타 다운로더</h1>
  <p class="sub">게시물·릴스 링크를 붙여넣으세요. 광고 없음.</p>

  <form id="form">
    <div class="box">
      <input id="url" type="url" inputmode="url" autocomplete="off"
             placeholder="https://www.instagram.com/reel/..." value="{{ shared }}">
      <button type="button" class="ghost" id="paste">붙여넣기</button>
    </div>
    <button class="go" id="go">동영상 찾기</button>
  </form>

  <div id="msg" class="msg"></div>
  <div id="result"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const form = $("form"), input = $("url"), msg = $("msg"), result = $("result"), go = $("go");

function setMsg(text, isError) {
  msg.textContent = text;
  msg.className = "msg" + (isError ? " error" : "");
}

function fmtTime(sec) {
  if (!sec) return "";
  sec = Math.round(sec);
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}

$("paste").addEventListener("click", async () => {
  try {
    input.value = (await navigator.clipboard.readText()).trim();
    form.requestSubmit();
  } catch {
    input.focus();
    setMsg("클립보드 접근이 막혀 있어요. 입력칸을 길게 눌러 붙여넣어 주세요.");
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = input.value.trim();
  if (!url) return;
  result.innerHTML = "";
  go.disabled = true;
  go.innerHTML = '<span class="spin"></span> 찾는 중...';
  setMsg("");
  try {
    const res = await fetch("/api/info", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    render(data);
  } catch (err) {
    setMsg(err.message || "오류가 발생했습니다.", true);
  } finally {
    go.disabled = false;
    go.textContent = "동영상 찾기";
  }
});

function render(data) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const who = document.createElement("b");
  who.textContent = data.uploader ? "@" + data.uploader : "";
  const cap = document.createElement("p");
  cap.textContent = data.caption;
  meta.append(who, cap);
  result.append(meta);

  data.items.forEach((item) => {
    const card = document.createElement("div");
    card.className = "item";
    if (item.thumbnail) {
      const img = document.createElement("img");
      img.src = "/api/thumb?src=" + encodeURIComponent(item.thumbnail);
      img.loading = "lazy";
      img.alt = "";
      card.append(img);
    }
    const row = document.createElement("div");
    row.className = "row";
    const info = document.createElement("span");
    info.className = "info";
    info.textContent = [
      data.items.length > 1 ? `${item.index + 1}/${data.items.length}` : "",
      fmtTime(item.duration),
      item.height ? item.height + "p" : "",
    ].filter(Boolean).join(" · ");
    const btn = document.createElement("button");
    btn.textContent = "다운로드";
    btn.addEventListener("click", () => download(data.url, item.index, btn));
    row.append(info, btn);
    card.append(row);
    result.append(card);
  });
}

async function download(url, index, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 저장 중';
  try {
    const res = await fetch(`/api/download?url=${encodeURIComponent(url)}&index=${index}`);
    if (!res.ok) throw new Error((await res.json()).error);
    const name = (res.headers.get("Content-Disposition") || "").match(/filename="?([^";]+)"?/)?.[1]
      || `instagram_${Date.now()}.mp4`;
    const blob = await res.blob();
    const file = new File([blob], decodeURIComponent(name), { type: blob.type });
    // 모바일에서는 공유 시트로 열어 '동영상 저장'으로 갤러리에 바로 저장할 수 있게 한다
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi/.test(navigator.userAgent)) {
      await navigator.share({ files: [file] }).catch(() => {});
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
    btn.textContent = "완료 ✓";
  } catch (err) {
    setMsg(err.message || "다운로드에 실패했습니다.", true);
    btn.textContent = "다운로드";
  } finally {
    btn.disabled = false;
  }
}

if (input.value) form.requestSubmit();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
